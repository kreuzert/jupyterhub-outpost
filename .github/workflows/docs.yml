name: docs

# Builds the Sphinx documentation and deploys it to GitHub Pages.
#
# Note: this repo is mirrored from GitLab, so the workflow is committed here
# and pushed to the GitHub mirror. The push then triggers the build on GitHub.
# The GitHub repo's Pages source must be set to "GitHub Actions" (Settings >
# Pages > Build and deployment > Source).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time, but don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Sphinx docs
        run: sphinx-build -b html docs docs/build/html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
