stages:
  - test
  - update
  - build
  - prepare-release
  - release

###
#
# Always run unittest
#
# Update requirements.txt
# pip install -U -r requirements.txt
# pip freeze > requirements.txt
###
unittests:
  stage: test
  image:
    name: python:3.13-alpine
  before_script:
    - apk add build-base linux-headers && pip3 install -U pip && pip3 install -r ${CI_PROJECT_DIR}/devel/requirements_pip.txt
  script:
    - cd ${CI_PROJECT_DIR}/project && pytest -c tests/pytest.ini
  rules:
    - if: '$CI_COMMIT_MESSAGE !~ /^Add changelog for version.*/'


###
#
# Check the pinned packages (pip + apk) of the production image for newer
# minor/patch releases and collect them on the single, long-lived branch
# ci/update-packages (one accumulating merge request). New major versions
# are only reported, never applied.
#
# Requires a project access token in the CI variable GL_TOKEN with the
# `api` and `write_repository` scopes.
#
###

update-packages:
  stage: update
  image: python:3.13-slim
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    # The python slim image does not ship git, which is needed to commit
    # and push the updated pins.
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
  script:
    - pip3 install --quiet packaging
    - python3 update-packages.py --yes --report-file package-update-report.md
    - |
      # Capture the diff separately: if git fails, the empty output of the
      # command substitution must not be mistaken for "nothing changed".
      if ! CHANGED="$(git diff --name-only -- project/requirements_pip.txt project/requirements_apk.txt)"; then
        echo "error: git diff failed" >&2
        exit 1
      fi
      if [[ -z "$CHANGED" ]]; then
        echo "no new minor/patch versions - nothing to update."
        exit 0
      fi
      test -n "${GL_TOKEN:-}" || { echo "error: GL_TOKEN (project access token) is required - it needs BOTH the api and write_repository scopes" >&2; exit 1; }
      # Fixed branch name: every run recomputes the updates from the current
      # main tip and force-pushes the same branch, so GitLab keeps a single
      # accumulating MR open (create-mr.py reuses it and refreshes its
      # description instead of stacking duplicate MRs).
      BRANCH="ci/update-packages"
      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@localhost"
      git checkout -B "$BRANCH"
      git add project/requirements_pip.txt project/requirements_apk.txt
      git commit -m "chore: update pip/apk packages (minor/patch only)" -m "Automated by the scheduled update-packages job."
      # The default CI origin authenticates with the read-only CI_JOB_TOKEN,
      # so it cannot push. Push explicitly with the project access token
      # GL_TOKEN instead - for a project token any non-blank username works.
      # The checkout remote already has scheme + job-token credentials embedded
      # (https://gitlab-ci-token:***@host/...), so strip both before adding ours.
      ORIGIN=$(git remote get-url origin)
      HOSTPATH=${ORIGIN#*://}   # drop scheme -> gitlab-ci-token:***@host/path
      HOSTPATH=${HOSTPATH#*@}   # drop embedded user:pass@ -> host/path
      PUSH_URL="https://ci-bot:${GL_TOKEN}@${HOSTPATH}"
      # Push via a temp file and scrub the token from git's output: on a
      # failed push git prints the full URL (token included) into the log.
      if ! git push -f "$PUSH_URL" "$BRANCH" > /tmp/push.out 2>&1; then
        sed "s/${GL_TOKEN}/REDACTED/g" /tmp/push.out >&2
        echo "error: git push failed" >&2
        exit 1
      fi
      sed "s/${GL_TOKEN}/REDACTED/g" /tmp/push.out
      rm -f /tmp/push.out
      echo "created branch: $BRANCH"
      python3 create-mr.py "$BRANCH" package-update-report.md
  artifacts:
    paths:
      - package-update-report.md
    when: always


###
#
# Creates an ubuntu based devel image, which can be used to debug the current Outpost version via VSCode
#
###

build-devel:
  stage: build
  image: moby/buildkit:latest
  variables:
    CACHE_IMAGE: "$CI_REGISTRY_IMAGE:buildcachedevel"
  script:
    # Authenticate to your registry
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
    - buildkitd &
    - sleep 5
    - buildctl build --frontend dockerfile.v0 --local context=${CI_PROJECT_DIR} --local dockerfile=${CI_PROJECT_DIR}/devel/ --output type=image,name=${CI_REGISTRY_IMAGE}:devel,push=true --output type=image,name=${CI_REGISTRY_IMAGE}:devel${CI_COMMIT_SHORT_SHA},push=true
    # - buildctl build --frontend dockerfile.v0 --export-cache type=registry,ref=$CACHE_IMAGE,mode=max --import-cache type=registry,ref=$CACHE_IMAGE --local context=${CI_PROJECT_DIR} --local dockerfile=${CI_PROJECT_DIR}/devel/ --output type=image,name=${CI_REGISTRY_IMAGE}:devel,push=true --output type=image,name=${CI_REGISTRY_IMAGE}:devel${CI_COMMIT_SHORT_SHA},push=true
  rules:
    - when: manual
  allow_failure: true

###
#
# Create docker image at hub.docker.com for all releases
#
###

build-tag-docker:
  stage: build
  image: moby/buildkit:latest
  script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY_DOCKERHUB}\":{\"username\":\"${CI_REGISTRY_DOCKERHUB_USER}\",\"password\":\"${CI_REGISTRY_DOCKERHUB_PASSWORD}\"}}}" > ~/.docker/config.json
    - buildkitd &
    - sleep 5
    - sed -i -e "s/<VERSION>/${CI_COMMIT_TAG} (${CI_COMMIT_SHORT_SHA})/g" ${CI_PROJECT_DIR}/project/app/spawner/outpost.py
    - buildctl build --frontend dockerfile.v0 --local context=${CI_PROJECT_DIR} --local dockerfile=${CI_PROJECT_DIR}/project/ --output type=image,name=${CI_REGISTRY_DOCKERHUB_BASEIMAGE}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG},push=true --output type=image,name=${CI_REGISTRY_DOCKERHUB_BASEIMAGE}/${CI_PROJECT_NAME}:latest,push=true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'

###
#
# Create docker image for any other tags on gitlab private registry
#
###

build-tag:
  stage: build
  image: moby/buildkit:latest
  variables:
    CACHE_IMAGE: "$CI_REGISTRY_IMAGE:buildcache"
  script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
    - buildkitd &
    - sleep 5
    - sed -i -e "s/<VERSION>/${CI_COMMIT_TAG} (${CI_COMMIT_SHORT_SHA})/g" ${CI_PROJECT_DIR}/project/app/spawner/outpost.py
    - buildctl build --frontend dockerfile.v0 --export-cache type=registry,ref=$CACHE_IMAGE,mode=max --import-cache type=registry,ref=$CACHE_IMAGE --local context=${CI_PROJECT_DIR} --local dockerfile=${CI_PROJECT_DIR}/project/ --output type=image,name=${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG},push=true --output type=image,name=${CI_REGISTRY_IMAGE}:latest,push=true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-.+)$/'

###
#
# Prepare release notes
#
###

prepare_job:
  stage: prepare-release
  image: alpine:latest
  rules:
  - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    - apk add curl jq
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | jq -r .notes > release_notes.md'
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" -X POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG"'
  artifacts:
    paths:
    - release_notes.md

###
#
# Create release
#
###

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: prepare_job
      artifacts: true
  rules:
  - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    - echo "Creating release"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: release_notes.md
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Container Image $CI_COMMIT_TAG'
          url: "https://hub.docker.com/r/jupyterjsc/jupyterhub-outpost/tags?page=&page_size=&ordering=&name=${CI_COMMIT_TAG}"
